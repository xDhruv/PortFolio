<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhruv Verma | PortFolio</title>

  <base href="/PortFolio/">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    /* Make scrollDown clickable */
    #scrollDown { z-index: 2001 !important; cursor: pointer; pointer-events: auto; }
    .toggler { z-index: 3000; }
    .menu { z-index: 3001; }
  </style>
</head>

<body>
  <div id="all-content">
    <div class="bg-box"></div>

    <header>
      <a class="navbrand" href="index.html">
        <span class="navbrand-icon">D</span>hruv
      </a>

      <div class="menu-wrap">
        <input type="checkbox" class="toggler" aria-label="Open menu" />
        <div id="hamburger" class="hamburger" aria-hidden="true">
          <div id="hamburger-lines"></div>
        </div>

        <div class="menu">
          <div id="menusub1">
            <div id="menusub2">
              <ul id="menu-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="assets/resume/Dhruv_Resume.pdf" target="_blank" rel="noreferrer">Resume</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- HOME HERO -->
    <section class="vertical-scrolling homepage" id="home">
      <div class="home">
        <div class="home-left">
          <div class="typeit-content">
            <span class="typeit-subtitle">HEY! I AM</span>
            <h2 class="typeit-title">Dhruv Verma</h2>
            <h1>I'm a <span id="typeit-quote"></span></h1>

            <div class="home-cta" style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
              <a id="resume-link" href="projects.html">View Projects</a>
              <a id="resume-link" href="assets/resume/Dhruv_Resume.pdf" target="_blank" rel="noreferrer">Download Resume</a>
            </div>
          </div>
        </div>

        <div class="home-right">
          <div class="title1"><h1>Hello<span>&#46;</span></h1></div>
          <div class="title2"><h1>I am</h1></div>
          <div class="title3"><h1>Dhruv</h1></div>
        </div>
      </div>
    </section>

    <p id="scrollDown" class="scrollDown"><span>SCROLLDOWN</span></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.11"></script>

  <script>
    // Typed.js
    (function () {
      var el = document.getElementById("typeit-quote");
      if (el && typeof Typed !== "undefined" && !el.dataset.typedInit) {
        el.dataset.typedInit = "1";
        new Typed("#typeit-quote", {
          strings: ["Data Analyst", "Tech Enthusiast", "Operations Analyst"],
          typeSpeed: 50,
          smartBackspace: true,
          backSpeed: 35,
          backDelay: 1000,
          cursorChar: "\u25AE",
          loop: true
        });
      }
    })();

    // ScrollDown -> go to Skills page (since we are multi-page now)
    document.getElementById("scrollDown").addEventListener("click", function () {
      window.location.href = "skills.html";
    });

    // Close menu after click
    document.querySelectorAll("#menu-links a").forEach(a => {
      a.addEventListener("click", () => {
        const t = document.querySelector(".toggler");
        if (t) t.checked = false;
      });
    });
  </script>
</body>
</html>
